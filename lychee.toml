# DOI registration and metadata are checked separately by check_references.py.
# Do not treat a publisher's bot challenge (403/429) as a successful link check.
exclude = ['^https://doi\.org/']

max_concurrency = 4
host_concurrency = 1
host_request_interval = "1s"
timeout = 30
max_retries = 3
retry_wait_time = 5
max_redirects = 10
accept = ["200..=299"]
include_fragments = "anchor-only"
exclude_all_private = true
no_progress = true
# Extract URLs from the JSON exception register as well as Markdown documents.
default_extension = "txt"
